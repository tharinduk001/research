# postgres_exporter — exposes the PostgreSQL *server's* own internals as Prometheus
# metrics (connection counts, transaction rates, locks, cache hit ratio, replication).
#
# This is complementary to, not a replacement for, django-prometheus' DB metrics:
#   - django_prometheus  -> what the Django app experiences (query counts, errors)
#   - postgres_exporter  -> what the database itself is doing (locks, connections)
#
# Credentials are read from the existing postgres-secret, so no password is
# duplicated into this file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: dev
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - name: metrics
              containerPort: 9187
          env:
            # postgres-svc is headless, but DNS still resolves to the pod IP
            - name: DATA_SOURCE_URI
              value: "postgres-svc:5432/db?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-svc
  namespace: dev
  labels:
    monitoring: postgres      # what the ServiceMonitor below selects on
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter-servicemonitor
  namespace: dev
  labels:
    release: prometheus       # must match the Prometheus Helm release name
spec:
  selector:
    matchLabels:
      monitoring: postgres
  endpoints:
    - port: metrics
      interval: 15s
